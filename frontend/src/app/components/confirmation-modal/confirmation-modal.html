<div *ngIf="isVisible" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>{{ title }}</h2>
      <div class="success-icon">✓</div>
    </div>

    <div class="modal-body">
      <p class="message">{{ message }}</p>

      <div *ngIf="details" class="details-section">
        <div *ngFor="let item of (details | keyvalue)" class="detail-item">
          <span class="detail-label">{{ item.key }}:</span>
          <span class="detail-value">{{ item.value }}</span>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button (click)="confirm()" class="btn btn-primary btn-confirm">
        {{ confirmButtonText }}
      </button>
    </div>
  </div>
</div>
